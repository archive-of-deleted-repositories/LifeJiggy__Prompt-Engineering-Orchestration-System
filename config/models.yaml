# Default provider and model
default_provider: "openai"
default_model: "gpt-4o"

# Model configurations
models:
  # OpenAI models
  gpt-4o:
    provider: openai
    name: gpt-4o
    max_tokens: 128000
    temperature: 0.7
    top_p: 1.0
    frequency_penalty: 0.0
    presence_penalty: 0.0
    streaming: true
    timeout: 120
    retry_attempts: 3
    fallback: gpt-4o-mini
    cost_per_1k_input: 0.005
    cost_per_1k_output: 0.015
    capabilities:
      - code_generation
      - reasoning
      - analysis
      - creative_writing
      - tool_use
      - vision
      - function_calling
    context_window: 128000
  
  gpt-4o-mini:
    provider: openai
    name: gpt-4o-mini
    max_tokens: 128000
    temperature: 0.7
    top_p: 1.0
    frequency_penalty: 0.0
    presence_penalty: 0.0
    streaming: true
    timeout: 120
    retry_attempts: 3
    fallback: gpt-3.5-turbo
    cost_per_1k_input: 0.00015
    cost_per_1k_output: 0.0006
    capabilities:
      - code_generation
      - reasoning
      - analysis
      - creative_writing
      - tool_use
      - vision
      - function_calling
    context_window: 128000

  gpt-4-turbo:
    provider: openai
    name: gpt-4-turbo-preview
    max_tokens: 128000
    temperature: 0.7
    top_p: 1.0
    streaming: true
    timeout: 120
    retry_attempts: 3
    fallback: gpt-4
    capabilities:
      - code_generation
      - reasoning
      - analysis
      - creative_writing
      - tool_use
      - extended_context

  gpt-3.5-turbo:
    provider: openai
    name: gpt-3.5-turbo
    max_tokens: 16385
    temperature: 0.7
    streaming: true
    timeout: 60
    retry_attempts: 3
    fallback: gpt-3.5-turbo-16k
    capabilities:
      - code_generation
      - reasoning
      - analysis
      - creative_writing

  claude-3-opus:
    provider: anthropic
    name: claude-3-opus-20240229
    max_tokens: 4096
    temperature: 0.7
    streaming: true
    timeout: 120
    retry_attempts: 3
    fallback: claude-3-sonnet
    capabilities:
      - code_generation
      - reasoning
      - analysis
      - creative_writing
      - extended_context
      - safety

  claude-3-sonnet:
    provider: anthropic
    name: claude-3-sonnet-20240229
    max_tokens: 4096
    temperature: 0.7
    streaming: true
    timeout: 120
    retry_attempts: 3
    fallback: claude-2.1
    capabilities:
      - code_generation
      - reasoning
      - analysis
      - creative_writing

  claude-2.1:
    provider: anthropic
    name: claude-2.1
    max_tokens: 4096
    temperature: 0.7
    streaming: true
    timeout: 120
    retry_attempts: 3
    fallback: claude-instant
    capabilities:
      - code_generation
      - reasoning
      - analysis
      - creative_writing

  claude-instant:
    provider: anthropic
    name: claude-instant-1.2
    max_tokens: 4096
    temperature: 0.7
    streaming: true
    timeout: 60
    retry_attempts: 3
    capabilities:
      - code_generation
      - reasoning
      - analysis

  gemini-pro:
    provider: google
    name: gemini-pro
    max_tokens: 8192
    temperature: 0.7
    top_k: 40
    streaming: true
    timeout: 120
    retry_attempts: 3
    fallback: gemini-pro-vision
    capabilities:
      - code_generation
      - reasoning
      - analysis
      - creative_writing
      - multimodal

  gemini-pro-vision:
    provider: google
    name: gemini-pro-vision
    max_tokens: 8192
    temperature: 0.7
    streaming: true
    timeout: 120
    retry_attempts: 3
    capabilities:
      - code_generation
      - reasoning
      - analysis
      - creative_writing
      - multimodal

embedding_models:
  text-embedding-3-small:
    provider: openai
    name: text-embedding-3-small
    dimensions: 1536
    max_tokens: 8191
    capabilities:
      - semantic_search
      - text_similarity

  text-embedding-3-large:
    provider: openai
    name: text-embedding-3-large
    dimensions: 3072
    max_tokens: 8191
    capabilities:
      - semantic_search
      - text_similarity
      - high_precision

  text-embedding-ada-002:
    provider: openai
    name: text-embedding-ada-002
    dimensions: 1536
    max_tokens: 8191
    capabilities:
      - semantic_search
      - text_similarity

  sentence-transformers/all-MiniLM-L6-v2:
    provider: huggingface
    name: sentence-transformers/all-MiniLM-L6-v2
    dimensions: 384
    max_tokens: 256
    capabilities:
      - semantic_search
      - text_similarity
      - local_processing

  sentence-transformers/all-mpnet-base-v2:
    provider: huggingface
    name: sentence-transformers/all-mpnet-base-v2
    dimensions: 768
    max_tokens: 256
    capabilities:
      - semantic_search
      - text_similarity
      - high_precision

model_defaults:
  temperature: 0.7
  max_tokens: 4096
  retry_attempts: 3
  timeout: 120
  streaming: true

cost_tracking:
  enabled: true
  currency: USD
  pricing:
    gpt-4:
      input_cost_per_1k_tokens: 0.03
      output_cost_per_1k_tokens: 0.06
    gpt-4-turbo:
      input_cost_per_1k_tokens: 0.01
      output_cost_per_1k_tokens: 0.03
    gpt-3.5-turbo:
      input_cost_per_1k_tokens: 0.0005
      output_cost_per_1k_tokens: 0.0015
    claude-3-opus:
      input_cost_per_1k_tokens: 0.015
      output_cost_per_1k_tokens: 0.075
    claude-3-sonnet:
      input_cost_per_1k_tokens: 0.003
      output_cost_per_1k_tokens: 0.015
    gemini-pro:
      input_cost_per_1k_tokens: 0.0005
      output_cost_per_1k_tokens: 0.0015
